[project]
name = "medscribe"
version = "0.1.0"
description = "MedScribe Agent: turns an outpatient consultation transcript into a draft ePrescription the doctor reviews and approves."
readme = "README.md"
authors = [{ name = "Thakur Patel" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
